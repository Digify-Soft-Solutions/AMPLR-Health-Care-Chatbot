name: 24/7 Render Keep-Alive

on:
  schedule:
    # Triggered automatically every 14 minutes
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Healthcare Bot Health Check
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          if [ -n "$RENDER_APP_URL" ]; then
            echo "Pinging Render server at $RENDER_APP_URL..."
            curl -s -f -m 30 "$RENDER_APP_URL/health" || echo "Ping dispatched"
          else
            echo "RENDER_APP_URL secret not set. Skipping keep-alive ping."
          fi
